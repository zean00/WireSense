<!doctype html>
<html><head><title>Feedback — WireApp</title></head>
<body>
<h1>Send us feedback</h1>
<form action="form-done.html" method="get">
  <label>Name <input type="text" name="name" placeholder="Your name"></label><br>
  <label>Email <input type="text" name="email" placeholder="you@example.com"></label><br>
  <label>Message <textarea name="message" placeholder="Your message"></textarea></label><br>
  <button type="submit">Submit feedback</button>
</form>
</body></html>
