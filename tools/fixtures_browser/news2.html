  <h1>Solar panels hit record efficiency</h1>
  <p>Researchers reported 40.1 percent efficiency in lab tests this week,
  beating the previous record by two full points. The cells use a
  perovskite-silicon tandem stack.</p>
  <p>Commercial panels are expected to follow within three years.</p>
