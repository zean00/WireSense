<h1>The brew guide</h1>
<p>We recommend a 1:2 ratio — 18 grams of dry coffee in, 36 grams of
espresso out, in a shot that runs 25 to 30 seconds.</p>
<p>Grind finer when the shot runs fast, coarser when it runs slow; the
grind size page has the full scale.</p>
