<h1>Kitchen basics</h1>
<p>For the overnight loaf, proof the dough for 90 minutes at room
temperature, then fold it once and proof 30 minutes more before
shaping.</p>
<p>Bake in a preheated dutch oven at 230 C — 35 minutes with the lid
on, 12 more with it off.</p>
