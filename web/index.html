<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>wiresense</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: system-ui, sans-serif; background: #0b0e14; color: #dbe2ee;
         margin: 0; overflow: hidden; }
  h1 { font-size: 17px; margin: 0; }
  h1 span { color: #5eead4; }
  #app { display: grid; grid-template-columns: 300px minmax(340px, 1fr) 390px;
         grid-template-rows: 54px 1fr; height: 100vh; }
  header { grid-column: 1 / 4; display: flex; align-items: center; gap: 14px;
           padding: 0 16px; border-bottom: 1px solid #1d2939; background: #0d1119; }
  #stats { font-size: 12px; color: #7d8aa0; flex: 1; white-space: nowrap;
           overflow: hidden; text-overflow: ellipsis; }
  button { font-size: 14px; padding: 8px 14px; border-radius: 9px; border: 1px solid #334;
           background: #16202f; color: #dbe2ee; cursor: pointer; }
  button.on { background: #134e4a; border-color: #14b8a6; }
  #left, #center, #right { overflow-y: auto; min-height: 0; }
  #left  { border-right: 1px solid #1d2939; padding: 10px; }
  #right { border-left: 1px solid #1d2939; padding: 10px; }
  #center { display: flex; flex-direction: column; padding: 14px 26px; }
  .card { background: #101725; border: 1px solid #1d2939; border-radius: 10px;
          padding: 10px 12px; margin: 8px 0; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #7d8aa0; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 11px;
           letter-spacing: 0; margin-left: 6px; }
  .badge.ok   { background: #134e4a; color: #5eead4; }
  .badge.warn { background: #4d3a10; color: #fbbf24; }
  .badge.bad  { background: #4c1d1d; color: #f87171; }
  .badge.idle { background: #1d2939; color: #7d8aa0; }
  .hgrid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px 14px;
           font-size: 12px; margin-top: 6px; }
  .hgrid .k { color: #7d8aa0; }
  .hgrid .v { text-align: right; font-variant-numeric: tabular-nums; }
  .rwrow { margin-top: 5px; font-size: 11px; color: #93c5fd;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #h_reasons { font-size: 11.5px; margin-top: 6px; color: #fbbf24; }
  /* decision tree visualization */
  #dtree { margin-top: 6px; font-size: 12px; }
  .drow { display: flex; align-items: center; gap: 8px; padding: 2.5px 6px;
          border-radius: 6px; }
  .drow.sub1 { margin-left: 12px; border-left: 1px solid #1d2939; }
  .drow.sub2 { margin-left: 26px; border-left: 1px solid #2e1065; }
  .dchip { padding: 1px 10px; border-radius: 99px; background: #1d2939;
           border: 1px solid transparent; color: #94a3b8; }
  .drow .dcount { margin-left: auto; color: #475569;
                  font-variant-numeric: tabular-nums; font-size: 10.5px; }
  .drow.fired .dchip { border-color: currentColor; }
  .drow.fired .dcount { color: #e2e8f0; }
  @keyframes dfire { 0% { background: #5eead42e; } 100% { background: transparent; } }
  .drow.pulse { animation: dfire .9s ease-out; }
  .c-root    { color: #e2e8f0; border-color: #334155; }
  .c-direct  { color: #5eead4; } .c-think  { color: #c4b5fd; }
  .c-long_think { color: #a78bfa; } .c-tool { color: #fbbf24; }
  .c-decide  { color: #fdba74; } .c-social { color: #f9a8d4; }
  .c-vision  { color: #7dd3fc; }
  .mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 18px;
           font-size: 12px; margin-top: 6px; }
  .mgrid .k { color: #7d8aa0; }
  .mgrid .v { text-align: right; font-variant-numeric: tabular-nums; }
  .sec { font-size: 10.5px; color: #5eead4; margin-top: 6px; text-transform: uppercase;
         letter-spacing: .06em; }
  #camview { width: 100%; border-radius: 8px; margin-top: 6px; display: none; }
  #camcanvas { display: none; }
  #evtlog { font-family: ui-monospace, monospace; font-size: 10.5px; color: #64748b;
            line-height: 1.5; margin-top: 6px; word-break: break-all; }
  #evtlog .t { color: #475569; }

  /* --- center stage --- */
  #modebadge { align-self: center; font-size: 12.5px; letter-spacing: .04em; }
  #modebadge span { padding: 3px 12px; border-radius: 99px; background: #1d2939; color: #7d8aa0; }
  #modebadge.direct span    { background: #134e4a; color: #5eead4; }
  #modebadge.think span     { background: #2e1065; color: #c4b5fd; }
  #modebadge.think\.tool span { background: #4d3a10; color: #fbbf24; }
  #modebadge.decide span    { background: #431407; color: #fdba74; }
  #modebadge.social span    { background: #500724; color: #f9a8d4; }
  #modebadge.vision span    { background: #0c4a6e; color: #7dd3fc; }
  .stagewrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 120px; }
  #wave { width: 100%; height: 170px; }
  #partial { min-height: 22px; color: #9fb3c8; font-style: italic; text-align: center; }
  #reply { min-height: 24px; font-size: 18px; text-align: center; padding-bottom: 8px; }

  /* --- conversation history --- */
  #feed { display: flex; flex-direction: column; gap: 2px; }
  .turn { margin: 4px 0 14px; }
  .cue { font-size: 11.5px; color: #64748b; font-style: italic; }
  .userrow { display: flex; justify-content: flex-end; margin: 6px 0; }
  .userb { background: #123c3a; border: 1px solid #14b8a655; border-radius: 14px 14px 3px 14px;
           padding: 7px 12px; max-width: 88%; font-size: 14px; }
  .filler { font-size: 12px; color: #7d8aa0; font-style: italic; margin: 3px 0 3px 4px; }
  .replyb { border-left: 2px solid #14b8a6; padding: 2px 0 2px 10px; margin: 6px 0;
            font-size: 14.5px; white-space: pre-wrap; }
  .vframe { margin: 6px 0; }
  .vframe img { width: 210px; border-radius: 8px; border: 1px solid #1d2939; display: block; }
  .vframe .cap { font-size: 10.5px; color: #7d8aa0; margin-top: 2px; }
  details.think { margin: 6px 0; border: 1px solid #2e1065; border-radius: 8px;
                  background: #150e2a; }
  details.think summary { cursor: pointer; font-size: 12px; color: #c4b5fd;
                          padding: 5px 10px; user-select: none; }
  details.think pre { margin: 0; padding: 4px 12px 10px; font-family: ui-monospace, monospace;
                      font-size: 11.5px; color: #a78bfa; white-space: pre-wrap;
                      word-break: break-word; }
  .toolrow { font-family: ui-monospace, monospace; font-size: 11.5px; color: #fbbf24;
             background: #1a1508; border: 1px solid #4d3a10; border-radius: 8px;
             padding: 6px 9px; margin: 6px 0; word-break: break-word; }
  .toolrow .res { color: #94a3b8; }
  .sysrow { text-align: center; font-size: 12px; color: #fbbf24; margin: 4px 0; }
  .errrow { text-align: center; font-size: 12px; color: #f87171; margin: 4px 0; }
  .mm { font-size: 10.5px; color: #64748b; margin-top: 5px; font-variant-numeric: tabular-nums; }
  .toast { position: fixed; right: 18px; bottom: 18px; z-index: 50;
           background: #1e293b; color: #e2e8f0; border: 1px solid #334155;
           border-radius: 8px; padding: 10px 14px; font-size: 13px;
           box-shadow: 0 6px 24px rgba(0,0,0,.35); max-width: 320px; }
  @media (max-width: 1180px) {
    #app { grid-template-columns: 260px minmax(300px, 1fr) 330px; }
  }
</style>
</head>
<body>
<div id="app">
<header>
  <h1><span>wiresense</span></h1>
  <div id="stats">not connected</div>
  <button id="mic">Start mic</button>
  <button id="cam">📷 Camera</button>
  <button id="amb" hidden>👁 Ambient</button>
  <button id="reset">Reset</button>
</header>

<div id="left">
  <div class="card">
    <div class="label">mic health<span id="micverdict" class="badge idle">mic off</span></div>
    <div class="hgrid">
      <span class="k">level (rms)</span><span class="v" id="h_rms">–</span><span class="k" id="h_rms_note"></span>
      <span class="k">peak</span><span class="v" id="h_peak">–</span><span class="k" id="h_peak_note"></span>
      <span class="k">dc offset</span><span class="v" id="h_dc">–</span><span class="k" id="h_dc_note"></span>
      <span class="k">clipped</span><span class="v" id="h_clip">–</span><span class="k" id="h_clip_note"></span>
      <span class="k">hf energy (3k+)</span><span class="v" id="h_hf">–</span><span class="k" id="h_hf_note"></span>
      <span class="k">vad p(speech)</span><span class="v" id="h_vad">–</span><span class="k" id="h_vad_note"></span>
      <span class="k">capture rate</span><span class="v" id="h_rate">–</span><span class="k"></span>
    </div>
    <div id="h_reasons"></div>
  </div>
  <div class="card">
    <div class="label">decision tree<span id="dtver" class="badge idle">…</span></div>
    <div id="dtree"></div>
  </div>
  <div class="card">
    <div class="label">router</div>
    <div class="hgrid">
      <span class="k">last route</span><span class="v" id="r_mode">–</span>
      <span class="k">confidence</span><span class="v" id="r_conf">–</span>
      <span class="k">readouts</span><span class="v" id="r_n">–</span>
      <span class="k">last readout</span><span class="v" id="r_ms">–</span>
      <span class="k">ttft</span><span class="v" id="r_ttft">–</span>
      <span class="k">decode</span><span class="v" id="r_tps">–</span>
    </div>
    <div class="rwrow" id="r_rw" hidden></div>
  </div>
  <div class="card">
    <div class="label">last turn — pipeline metrics</div>
    <div class="mgrid" id="metrics"><span class="k">no turn yet</span></div>
  </div>
  <div class="card">
    <div class="label">camera<span id="camstate" class="badge idle">off</span></div>
    <video id="camview" playsinline muted></video>
  </div>
  <canvas id="camcanvas"></canvas>
  <div class="card">
    <div class="label">event log</div>
    <div id="evtlog"></div>
  </div>
</div>

<div id="center">
  <div id="modebadge"><span>idle</span></div>
  <div class="stagewrap"><canvas id="wave"></canvas></div>
  <div id="partial">—</div>
  <div id="reply">—</div>
</div>

<div id="right">
  <div class="label" style="margin: 2px 4px 8px">conversation</div>
  <div id="feed"></div>
</div>
</div>

<script>
const wsURL = `ws://${location.host}/ws`;
let ws, ctx, workletNode, analyser, stream, listening = false;
let audioQueue = [], playing = false;

function setStats(s) { document.getElementById("stats").textContent = s; }
const el = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function connect() {
  ws = new WebSocket(wsURL);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => setStats("connected — click Start mic, then just talk");
  ws.onmessage = onMessage;
  ws.onclose = () => { setStats("disconnected"); if (listening) stopMic(); };
}

// --- event log (debug feed, newest first) ---
const evtRing = [];
function logEvent(m) {
  evtRing.unshift(new Date().toLocaleTimeString() + " " + m.type + " " +
    JSON.stringify(m, (k, v) => k === "audio" || k === "b64" ? `<${v.length} b64>` : v));
  if (evtRing.length > 60) evtRing.pop();
  el("evtlog").innerHTML = evtRing.map(
    s => `<div><span class="t">${esc(s.slice(0, 8))}</span> ${esc(s.slice(9, 150))}</div>`).join("");
}

// --- conversation history feed ---
const feed = el("feed");
let curTurn = null;          // current turn container
let pendingCues = [];        // backchannels heard before the final
let nearBottom = true;
feed.onscroll = () => {
  nearBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 60;
};
function scrollFeed() { if (nearBottom) feed.scrollTop = feed.scrollHeight; }
function newTurn() {
  const d = document.createElement("div");
  d.className = "turn";
  for (const c of pendingCues) {
    const cue = document.createElement("div");
    cue.className = "cue"; cue.textContent = `[${c}]`;
    d.appendChild(cue);
  }
  pendingCues = [];
  feed.appendChild(d);
  curTurn = d;
  scrollFeed();
  return d;
}
function turnPart(cls) {
  if (!curTurn) newTurn();
  const d = document.createElement("div");
  d.className = cls;
  curTurn.appendChild(d);
  scrollFeed();
  return d;
}
function sysLine(text, cls = "sysrow") {
  const d = document.createElement("div");
  d.className = cls; d.textContent = text;
  feed.appendChild(d); scrollFeed();
}

let lastUserEl = null;
function setModeBadge(mode) {
  const b = el("modebadge");
  b.className = mode || "";
  b.innerHTML = `<span>${esc(mode || "idle")}</span>`;
}

// --- decision tree visualization (structure from /tree.json, fires on route) ---
let TREE = null, lastTreeMode = null;
const treeCounts = {};
function treeRows(host, nodeId, depth) {
  const classes = (TREE.nodes[nodeId] || {}).classes || {};
  for (const [name, spec] of Object.entries(classes)) {
    const row = document.createElement("div");
    row.className = `drow sub${depth}`;
    row.dataset.node = nodeId; row.dataset.cls = name;
    const chip = document.createElement("span");
    chip.className = `dchip c-${name}`;
    chip.textContent = name;
    const cnt = document.createElement("span");
    cnt.className = "dcount"; cnt.textContent = "0";
    row.append(chip, cnt);
    host.appendChild(row);
    if (spec.action === "subtree" && TREE.nodes[spec.node])
      treeRows(host, spec.node, depth + 1);
  }
}
function buildTree() {
  const host = el("dtree");
  host.innerHTML = "";
  const rootRow = document.createElement("div");
  rootRow.className = "drow sub0";
  rootRow.dataset.node = "root"; rootRow.dataset.cls = "root";
  rootRow.innerHTML = `<span class="dchip c-root">root</span><span class="dcount">0</span>`;
  host.appendChild(rootRow);
  treeRows(host, "root", 1);
  el("dtver").textContent = "v" + TREE.version;
  if (lastTreeMode) fireTree(lastTreeMode);
}
function fireTree(mode) {
  if (!TREE) { lastTreeMode = mode; return; }
  lastTreeMode = mode;
  const parts = String(mode).split(".");
  const path = [["root", "root"], ["root", parts[0]]];
  if (parts[0] === "think" && parts[1] &&
      ((TREE.nodes.think || {}).classes || {})[parts[1]])
    path.push(["think", parts[1]]);
  document.querySelectorAll("#dtree .drow.fired")
    .forEach(r => r.classList.remove("fired", "pulse"));
  for (const [node, cls] of path) {
    const row = document.querySelector(
      `#dtree .drow[data-node="${node}"][data-cls="${cls}"]`);
    if (!row) continue;
    row.classList.remove("pulse"); void row.offsetWidth;  // restart animation
    row.classList.add("fired", "pulse");
    const key = node + "." + cls;
    treeCounts[key] = (treeCounts[key] || 0) + 1;
    row.querySelector(".dcount").textContent = treeCounts[key];
  }
}
fetch("/tree.json").then(r => r.json()).then(t => { TREE = t; buildTree(); })
  .catch(() => { el("dtver").textContent = "n/a"; });

function onMessage(ev) {
  const m = JSON.parse(ev.data);
  logEvent(m);
  if (m.type === "capabilities") {
    el("amb").hidden = !m.ambient;
    if (m.ambient) {
      let saved = null;
      try { saved = localStorage.getItem("ws_ambient"); } catch (e) {}
      setAmbient(saved === "1");  // re-arms the server-side session toggle
    }
  } else if (m.type === "partial") {
    el("partial").textContent = m.text;
  } else if (m.type === "decide") {
    el("r_n").textContent = m.top1 != null ? "running…" : "–";
    el("r_ms").textContent = (m.head_ms + m.emb_ms) + " ms";
  } else if (m.type === "route") {
    el("r_mode").textContent = m.mode;
    el("r_conf").textContent = m.conf;
    const rw = el("r_rw");
    rw.hidden = !m.rewrite;
    if (m.rewrite) {
      rw.textContent = `↻ routed via: ${m.rewrite}`;
      rw.title = `context rewrite used for routing (${m.rewrite_ms} ms)`;
    }
    setModeBadge(m.mode);
    fireTree(m.mode);
    // the route belongs to the turn opened by `final`
    if (!curTurn) newTurn();
    curTurn.dataset.mode = m.mode;
  } else if (m.type === "feedback") {
    const f = turnPart("filler");
    f.textContent = `— ${m.text}`;
    el("reply").textContent = `(${m.text})`;
  } else if (m.type === "backchannel") {
    pendingCues.push(m.text);
    el("partial").textContent = `[${m.text}]`;
  } else if (m.type === "vision_frame") {
    const v = turnPart("vframe");
    v.innerHTML = `<img alt="camera frame"><div class="cap">📷 frame captured for this turn</div>`;
    v.querySelector("img").src = "data:image/jpeg;base64," + m.b64;
    scrollFeed();
  } else if (m.type === "think_delta") {
    let box = curTurn && curTurn.querySelector("details.think");
    if (!box) {
      box = document.createElement("details");
      box.className = "think";
      box.innerHTML = `<summary>💭 thinking…</summary><pre></pre>`;
      (curTurn || newTurn()).insertBefore(
        box, curTurn.querySelector(".replyb"));
      scrollFeed();
    }
    box.querySelector("pre").textContent += m.text;
    box.open = true;
    box.querySelector("summary").textContent = "💭 thinking…";
    scrollFeed();
  } else if (m.type === "tool_call") {
    const t = turnPart("toolrow");
    t.innerHTML = `🔧 <b>${esc(m.tool)}</b> ${esc(JSON.stringify(m.args))}` +
      `<br><span class="res">→ ${esc(m.result)}</span>`;
  } else if (m.type === "cancel_tts") {
    audioQueue = []; if (playing) { stopPlayback(); }
  } else if (m.type === "tool_event") {
    handleToolEvent(m);
  } else if (m.type === "need_frame") {
    const b64 = grabFrame();
    if (b64) ws.send(JSON.stringify({type: "camera_frame", b64}));
  } else if (m.type === "response_start") {
    tStats.ttft = m.ttft_ms; renderStats();
    el("r_ttft").textContent = m.ttft_ms + " ms";
  } else if (m.type === "response_delta") {
    let r = curTurn && curTurn.querySelector(".replyb");
    if (!r) { r = turnPart("replyb"); }
    r.textContent += m.text;
    el("reply").textContent += m.text;
    scrollFeed();
  } else if (m.type === "response_done") {
    let r = curTurn && curTurn.querySelector(".replyb");
    if (!r) r = turnPart("replyb");
    r.textContent = m.text;
    el("reply").textContent = m.text;
    el("partial").textContent = "—";
    const th = curTurn && curTurn.querySelector("details.think");
    if (th) th.querySelector("summary").textContent = "💭 thinking";
    scrollFeed();
  } else if (m.type === "final") {
    newTurn();
    const row = document.createElement("div");
    row.className = "userrow";
    row.innerHTML = `<div class="userb">${esc(m.text)}</div>`;
    curTurn.appendChild(row);
    scrollFeed();
  } else if (m.type === "tts_chunk") {
    chunkRx = performance.now();
    tStats.tts = m.ms; renderStats();
    const buf = Uint8Array.from(atob(m.audio), c => c.charCodeAt(0));
    audioQueue.push(URL.createObjectURL(new Blob([buf], {type: "audio/wav"})));
    playNext();
  } else if (m.type === "mic_status") {
    if (m.vad != null) {
      el("h_vad").textContent = m.vad.toFixed(2);
      el("h_vad_note").textContent = m.vad >= 0.5 ? "speech" : "noise/silence";
    }
    if (m.listening === false) setMicHealthIdle();
  } else if (m.type === "metrics") {
    renderMetrics(m);
  } else if (m.type === "error") {
    setStats("error: " + m.message);
    sysLine("⚠ " + m.message, "errrow");
  } else if (m.type === "mic_state") {
    micPaused = !m.listening;
    renderStats();
  }
}

// --- tool events (server-delegated execution) ---
let toolCtx = null;
function beep(times = 2) {
  try {
    toolCtx = toolCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (toolCtx.state === "suspended") toolCtx.resume();
    const t0 = toolCtx.currentTime + 0.05;
    for (let i = 0; i < times; i++) {
      const o = toolCtx.createOscillator(), g = toolCtx.createGain();
      o.type = "sine"; o.frequency.value = 880;
      const t = t0 + i * 0.45;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.25, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      o.connect(g); g.connect(toolCtx.destination);
      o.start(t); o.stop(t + 0.4);
    }
  } catch (e) { /* audio unavailable — the toast still shows */ }
}
function toast(text, ms = 8000) {
  const d = document.createElement("div");
  d.className = "toast";
  d.textContent = text;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), ms);
}
function handleToolEvent(m) {
  if (m.tool === "timer") {
    toast(`⏱ timer started${m.label ? ": " + m.label : ""} (${m.seconds} s)`);
    setTimeout(() => {
      beep(3);
      toast(`⏱ time's up${m.label ? " — " + m.label : ""}`, 15000);
    }, m.seconds * 1000);
  } else if (m.type === "tool_event" && m.tool === "reminder_due") {
    beep(2);
    toast(`🔔 reminder: ${m.text}`, 15000);
    sysLine(`🔔 reminder: ${m.text}`);
  }
}

// --- camera (vision path): local-only until a turn needs a frame ---
let cameraStream = null;
async function toggleCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
    el("cam").textContent = "📷 Camera";
    el("cam").classList.remove("on");
    el("camview").style.display = "none";
    el("camstate").textContent = "off";
    el("camstate").className = "badge idle";
    ws.send(JSON.stringify({type: "camera_state", on: false}));
    return;
  }
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia(
      {video: {width: 640, height: 480}});
    el("camview").srcObject = cameraStream;
    await el("camview").play();
    el("camview").style.display = "block";
    el("cam").textContent = "📷 Camera ✓";
    el("cam").classList.add("on");
    el("camstate").textContent = "live";
    el("camstate").className = "badge ok";
    ws.send(JSON.stringify({type: "camera_state", on: true}));
  } catch (e) {
    setStats("camera unavailable: " + e.message);
    ws.send(JSON.stringify({type: "camera_state", on: false}));
  }
}
function grabFrame() {
  const v = el("camview"), c = el("camcanvas");
  if (!cameraStream || !v.videoWidth) return null;
  const scale = Math.min(1, 448 / Math.max(v.videoWidth, v.videoHeight));
  c.width = Math.round(v.videoWidth * scale);
  c.height = Math.round(v.videoHeight * scale);
  c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.8).split(",")[1];
}
el("cam").onclick = toggleCamera;

// --- ambient face context (docs/PROTOCOL-ambient-face.md): per-session
// toggle; the button only appears when the server advertises it, and the
// server clamps the state to its config opt-ins regardless ---
let ambientOn = false;
function setAmbient(on) {
  ambientOn = !!on;
  el("amb").textContent = ambientOn ? "👁 Ambient ✓" : "👁 Ambient";
  el("amb").classList.toggle("on", ambientOn);
  try { localStorage.setItem("ws_ambient", ambientOn ? "1" : "0"); } catch (e) {}
  if (ws && ws.readyState === 1)
    ws.send(JSON.stringify({type: "ambient_state", on: ambientOn}));
}
el("amb").onclick = () => setAmbient(!ambientOn);

let micPaused = false;
const tStats = {};
function renderStats() {
  let s = Object.entries(tStats).map(([k, v]) => `${k} ${v} ms`).join(" · ");
  if (micPaused) s = "🔊 speaking — mic gated" + (s ? " · " + s : "");
  setStats(s || "…");
}

// --- last-turn pipeline metrics ---
function renderMetrics(m) {
  lastMetrics = m;
  const g = el("metrics"); g.innerHTML = "";
  const row = (k, v) => { g.insertAdjacentHTML("beforeend",
    `<span class="k">${k}</span><span class="v">${v ?? "–"}</span>`); };
  const sec = t => { g.insertAdjacentHTML("beforeend",
    `<span class="sec" style="grid-column:1/3">${t}</span>`); };
  sec("asr");
  row("wake → final", m.asr.wake_to_final_ms != null ? m.asr.wake_to_final_ms + " ms" : null);
  row("speech duration", m.asr.audio_s + " s · " + m.asr.partials + " partials");
  row("first partial", m.asr.first_partial_ms != null ? m.asr.first_partial_ms + " ms" : null);
  row("decide readouts", m.decide.n ? `${m.decide.n} · last ${m.decide.last_ms} / max ${m.decide.max_ms} ms` : null);
  sec("llm");
  row("ttft", m.llm.ttft_ms != null ? m.llm.ttft_ms + " ms" : null);
  row("prefill", m.llm.prefill_tps ? `${m.llm.prompt_n} tok in ${m.llm.prompt_ms} ms — ${m.llm.prefill_tps} tok/s` : null);
  row("decode", m.llm.decode_tps ? `${m.llm.predicted_n} tok in ${m.llm.predicted_ms} ms — ${m.llm.decode_tps} tok/s` : null);
  el("r_tps").textContent = m.llm.decode_tps ? m.llm.decode_tps + " tok/s" : "–";
  if (m.llm.corrupt)
    g.insertAdjacentHTML("beforeend",
      `<span class="badge bad" style="grid-column:1/3">⚠ LLM output corrupt — GPU fp4 fault (make canary)</span>`);
  sec("tts + end-to-end");
  row("final → first audio", m.tts.first_ms != null ? m.tts.first_ms + " ms" : null);
  row("synthesis total", m.tts.total_ms + " ms · " + m.tts.sentences + " sentence(s)");
  row("playback start (browser)", playLatMs != null ? Math.round(playLatMs) + " ms" : null);
  const v2v = (m.tts.first_ms != null && playLatMs != null)
    ? `≈ ${Math.round(m.tts.first_ms + playLatMs)} ms` : null;
  row("voice → voice", v2v);
  if (curTurn) {
    const bits = [];
    if (m.llm.corrupt) bits.push("⚠ LLM corrupt");
    if (m.asr.wake_to_final_ms != null) bits.push(`asr ${Math.round(m.asr.wake_to_final_ms)}ms`);
    if (m.llm.ttft_ms != null) bits.push(`ttft ${Math.round(m.llm.ttft_ms)}ms`);
    if (m.llm.decode_tps) bits.push(`${m.llm.decode_tps} tok/s`);
    if (m.tts.first_ms != null) bits.push(`tts ${Math.round(m.tts.first_ms)}ms`);
    if (bits.length) {
      // renderMetrics runs twice per turn (on metrics, then again once
      // playback latency resolves) — the chip is always the turn's last
      // child, so update it in place instead of appending a second one
      const last = curTurn.lastElementChild;
      if (last && last.classList.contains("mm")) {
        last.textContent = bits.join(" · ");
      } else {
        const d = document.createElement("div");
        d.className = "mm"; d.textContent = bits.join(" · ");
        curTurn.appendChild(d);
      }
    }
  }
}
let lastMetrics = null, playLatMs = null, firstChunkOfTurn = true, chunkRx = 0;

// --- sequential playback (routed through an analyser for the waveform) ---
let audioEl = null, playbackSent = false;
let pctx = null, playAnalyser = null;
function ensurePlayGraph() {
  if (!pctx) {
    try {
      pctx = new (window.AudioContext || window.webkitAudioContext)();
      playAnalyser = pctx.createAnalyser();
      playAnalyser.fftSize = 1024;
      playAnalyser.connect(pctx.destination);
    } catch (e) { pctx = null; }
  }
  if (pctx && pctx.state === "suspended") pctx.resume();
}
function setPlayback(p) {
  if (p !== playbackSent && ws && ws.readyState === 1) {
    playbackSent = p;
    ws.send(JSON.stringify({type: "playback_state", playing: p}));
  }
}
function stopPlayback() {
  if (audioEl) { audioEl.pause(); audioEl = null; }
  playing = false;
  setPlayback(false);
}
function playNext() {
  if (playing || !audioQueue.length) return;
  playing = true;
  setPlayback(true);
  const rx = chunkRx, isFirst = firstChunkOfTurn;
  firstChunkOfTurn = false;
  ensurePlayGraph();
  audioEl = new Audio(audioQueue.shift());
  if (pctx && !audioEl.dataset.sourced) {
    try {
      pctx.createMediaElementSource(audioEl).connect(playAnalyser);
      audioEl.dataset.sourced = "1";
    } catch (e) { /* waveform falls back to synthetic */ }
  }
  audioEl.onplaying = () => {
    if (isFirst && playLatMs == null) {
      playLatMs = performance.now() - rx;
      if (lastMetrics) renderMetrics(lastMetrics);
    }
  };
  audioEl.onended = () => {
    playing = false;
    if (audioQueue.length) playNext();
    else setPlayback(false);   // speaker is actually done now
  };
  audioEl.play();
}

// --- waveform: mic live (teal) / assistant speaking (violet) / idle ---
const waveC = el("wave"), waveG = waveC.getContext("2d");
const BARS = 96;
let synthBars = new Array(BARS).fill(0), synthT = new Array(BARS).fill(0);
const micData = new Uint8Array(2048), playData = new Uint8Array(1024);
function drawWave(ts) {
  requestAnimationFrame(drawWave);
  const dpr = window.devicePixelRatio || 1;
  const w = waveC.clientWidth, h = waveC.clientHeight;
  if (!w || !h) return;
  if (waveC.width !== Math.round(w * dpr)) {
    waveC.width = Math.round(w * dpr); waveC.height = Math.round(h * dpr);
  }
  waveG.setTransform(dpr, 0, 0, dpr, 0, 0);
  waveG.clearRect(0, 0, w, h);
  let vals = synthBars, color = "#33415580";
  if (playing && pctx && pctx.state === "running" && audioEl && audioEl.dataset.sourced) {
    color = "#a78bfa";
    playAnalyser.getByteTimeDomainData(playData);
    vals = bucketize(playData, 128);
  } else if (playing) {
    color = "#a78bfa";
    for (let i = 0; i < BARS; i++) {
      synthT[i] += (Math.random() - 0.5) * 0.35;
      synthBars[i] += (0.25 + 0.2 * Math.sin(ts / 300 + i / 5) - synthBars[i]) * 0.2
        + synthT[i] * 0.05;
      synthBars[i] = Math.max(0.05, Math.min(1, synthBars[i]));
      synthT[i] *= 0.9;
    }
  } else if (listening && analyser) {
    color = "#14b8a6";
    analyser.getByteTimeDomainData(micData);
    vals = bucketize(micData, 128);
  } else {
    // idle: faint breathing line
    const a = 1.5 + Math.sin(ts / 700) * 0.8;
    waveG.fillStyle = "#33415580";
    waveG.fillRect(w / 2 - 40, h / 2 - a / 2, 80, a);
    return;
  }
  waveG.fillStyle = color;
  const bw = w / BARS;
  for (let i = 0; i < BARS; i++) {
    const v = Math.pow(Math.min(1, vals[i]), 0.75);
    const bh = Math.max(2, v * h * 0.46);
    waveG.fillRect(i * bw + bw * 0.18, h / 2 - bh / 2, bw * 0.64, bh);
  }
}
function bucketize(data, mid) {
  const out = new Array(BARS).fill(0);
  const per = Math.floor(data.length / BARS);
  for (let i = 0; i < BARS; i++) {
    let m = 0;
    for (let j = 0; j < per; j++) {
      const d = Math.abs(data[i * per + j] - mid) / mid;
      if (d > m) m = d;
    }
    // ~8x gain so quiet speech is clearly visible; loud speech clamps
    out[i] = Math.min(1, m * 8);
  }
  return out;
}
requestAnimationFrame(drawWave);

// --- mic health: stats per 100 ms frame, analyser band ratios, verdict ---
const micRing = [];              // last ~3 s of frame stats
let lastHf = null;
function pushFrameStats(pcm) {
  let sum = 0, sumsq = 0, peak = 0, sat = 0;
  for (let j = 0; j < pcm.length; j++) {
    const v = pcm[j], a = v < 0 ? -v : v;
    sum += v; sumsq += v * v;
    if (a > peak) peak = a;
    if (a >= 32200) sat++;               // ≥0.983 FS
  }
  const n = pcm.length;
  micRing.push({ rms: Math.sqrt(sumsq / n) / 32768, peak: peak / 32768,
                 dc: sum / n / 32768, clip: sat / n });
  if (micRing.length > 30) micRing.shift();
}
function bandRatio() {                  // HF (3 kHz+) share of total power
  if (!analyser) return null;
  const n = analyser.frequencyBinCount, d = new Float32Array(n);
  analyser.getFloatFrequencyData(d);
  const binHz = ctx.sampleRate / analyser.fftSize;
  let tot = 0, hf = 0;
  for (let i = 1; i < n; i++) {
    const p = d[i] === -Infinity ? 0 : Math.pow(10, d[i] / 10);
    tot += p;
    if (i * binHz >= 3000) hf += p;
  }
  return tot > 0 ? hf / tot : null;
}
function classifyMic(a) {
  const reasons = []; let worst = "ok";
  const bump = w => { if (w === "bad" || (w === "warn" && worst !== "bad")) worst = w; };
  if (a.dc >= 0.10)      { reasons.push("large DC offset — capture hardware fault (railed input)"); bump("bad"); }
  else if (a.dc >= 0.04) { reasons.push("DC offset present"); bump("warn"); }
  if (a.clip >= 0.03)    { reasons.push("clipping — signal saturating"); bump("bad"); }
  else if (a.clip >= 0.01) { reasons.push("near clipping"); bump("warn"); }
  if (a.rms < 0.008)     { reasons.push("too quiet — check gain/device"); bump("bad"); }
  else if (a.rms < 0.02) { reasons.push("low level"); bump("warn"); }
  if (a.hf != null) {
    if (a.hf < 0.005)      { reasons.push("muffled: consonant band (3 kHz+) missing"); bump("bad"); }
    else if (a.hf < 0.015) { reasons.push("HF energy low — consonants may smear"); bump("warn"); }
  }
  return { worst, reasons };
}
function setMicHealthIdle() {
  el("h_vad").textContent = "–"; el("h_vad_note").textContent = "gated";
}
function refreshHealth() {
  if (!listening || micRing.length < 5) return;
  const rms = Math.max(...micRing.map(s => s.rms));
  const peak = Math.max(...micRing.map(s => s.peak));
  const dc = micRing.reduce((a, s) => a + s.dc, 0) / micRing.length;
  const clip = Math.max(...micRing.map(s => s.clip));
  lastHf = bandRatio();
  el("h_rms").textContent = rms.toFixed(3);
  el("h_peak").textContent = peak.toFixed(3);
  el("h_dc").textContent = (dc >= 0 ? "+" : "") + dc.toFixed(3);
  el("h_clip").textContent = (clip * 100).toFixed(1) + "%";
  el("h_hf").textContent = lastHf != null ? (lastHf * 100).toFixed(1) + "%" : "–";
  if (rms < 0.02) {   // no signal in window: report meters, neutral verdict
    el("micverdict").textContent = "waiting for voice"; el("micverdict").className = "badge idle";
    el("h_reasons").textContent = "";
    return;
  }
  const v = classifyMic({ rms, peak, dc, clip, hf: lastHf });
  el("micverdict").textContent = v.worst === "ok" ? "mic OK" : v.worst === "warn" ? "warn" : "DEGRADED";
  el("micverdict").className = "badge " + v.worst;
  el("h_reasons").textContent = v.reasons.join(" · ");
}
setInterval(refreshHealth, 500);

// --- mic capture: resample to 16 kHz s16le, 100 ms frames ---
async function startMic() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: {
      echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch (e) {
    setStats("mic unavailable: " + e.message);
    return;
  }
  ctx = new AudioContext({ sampleRate: 16000 });  // browser resamples the graph
  const src = ctx.createMediaStreamSource(stream);
  analyser = ctx.createAnalyser();
  analyser.fftSize = 2048;
  src.connect(analyser);      // analysis tap only
  try {
    await ctx.audioWorklet.addModule("/capture-worklet.js");
  } catch (e) {
    setStats("mic worklet failed to load: " + e.message);
    stream.getTracks().forEach(t => t.stop());
    return;
  }
  workletNode = new AudioWorkletNode(ctx, "capture");
  workletNode.port.onmessage = (e) => {
    if (ws && ws.readyState === 1) ws.send(e.data);
    const pcm = new Int16Array(e.data);
    pushFrameStats(pcm);
  };
  src.connect(workletNode);
  if (ws && ws.readyState === 1)
    ws.send(JSON.stringify({type: "hello", ctx_rate: ctx.sampleRate}));
  el("h_rate") && (el("h_rate").textContent = ctx.sampleRate + " Hz");
  // worklet output not routed to destination: no local echo
  listening = true;
  el("mic").textContent = "Stop mic";
  el("mic").classList.add("on");
}

function stopMic() {
  listening = false;
  if (workletNode) workletNode.port.onmessage = null;
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (ctx) ctx.close();
  micRing.length = 0; lastHf = null;
  el("micverdict").textContent = "mic off"; el("micverdict").className = "badge idle";
  el("mic").textContent = "Start mic";
  el("mic").classList.remove("on");
}

el("mic").onclick = () => listening ? stopMic() : startMic();
el("reset").onclick = () => {
  ws.send(JSON.stringify({type: "reset"}));
  feed.innerHTML = "";
  curTurn = null;
  pendingCues = [];
  el("reply").textContent = "—";
  el("partial").textContent = "—";
  setModeBadge("");
};
connect();
</script>
</body>
</html>
